<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herson's Backpack - Buscador de Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Share Tech Mono', monospace; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .bg-gradient-blob { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.2; animation: float 20s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        .blob-1 { width: 50vw; height: 50vw; top: -20%; left: -10%; }
        .blob-2 { width: 40vw; height: 40vw; bottom: -10%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(5%, 10%) scale(1.1); } 66% { transform: translate(-5%, -5%) scale(0.9); } 100% { transform: translate(10%, -10%) scale(1.05); } }
        .result-card { transition: all 0.2s ease; border-left: 2px solid transparent; }
        .dash-btn { position: relative; overflow: hidden; transition: all 0.2s ease; z-index: 1; }
        .dash-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; transition: all 0.3s ease; z-index: -1; }
        .dash-btn:hover::before { left: 0; }
    </style>
</head>
<body class="flex flex-col">

    <div class="bg-gradient-blob blob-1"></div>
    <div class="bg-gradient-blob blob-2"></div>

    <header class="flex flex-col sm:flex-row items-center p-4 sm:p-6 w-full border-b hb-border hb-panel-alpha backdrop-blur-md sticky top-0 z-40 gap-4">
        <div class="flex-shrink-0 flex items-center gap-3">
            <a href="index.html" class="select-none transition-transform hover:scale-105" title="Back to Home">
                <img src="hb.png" alt="HB Logo" class="h-10 sm:h-12 object-contain filter drop-shadow-[0_0_8px_rgba(74,222,128,0.4)]">
            </a>
        </div>

        <div class="flex-grow flex justify-center w-full max-w-2xl px-2">
            <div class="search-bar flex items-center border hb-border rounded-md hb-panel px-4 py-2 w-full transition-all duration-300">
                <span class="hb-accent mr-3 text-lg">🔭</span>
                <input id="search-input" type="text" data-i18n-placeholder="search_bar_top" placeholder="Buscar por título, descripción corta, tecnología o autor..." class="bg-transparent w-full focus:outline-none hb-text-main placeholder-gray-500 font-mono text-base sm:text-lg" autocomplete="off" spellcheck="false">
                <button id="clear-search-btn" class="ml-2 hb-text-muted hover:text-green-400 transition-colors" title="Clear search">[x]</button>
            </div>
        </div>

        <div class="flex-shrink-0 flex items-center gap-2">
            <a href="workspace.html?tab=new" class="dash-btn border hb-border rounded-md px-3 py-2 text-xs sm:text-sm hb-accent flex items-center gap-1">
                <span>[n]</span> <span data-i18n="btn_newbackp">NewBackP</span>
            </a>
            <a href="workspace.html#mensajes-section" class="dash-btn border hb-border rounded-md px-3 py-2 text-xs sm:text-sm hb-text-main flex items-center gap-1">
                <span>[✉]</span> <span data-i18n="nav_messages">Mensajes</span>
            </a>
        </div>
    </header>

    <main class="flex-grow w-full max-w-4xl mx-auto px-6 py-8">
        <div class="flex flex-wrap items-center gap-2 text-xs mb-6 pb-4 border-b hb-border">
            <span class="hb-text-muted mr-1" data-i18n="filter_type">Tipo:</span>
            <button data-tipo="ALL" class="tipo-pill px-2.5 py-1 rounded border hb-border hb-accent font-bold" data-i18n="filter_all">TODOS</button>
            <button data-tipo="Programming" class="tipo-pill px-2.5 py-1 rounded border hb-border hb-text-muted hover:underline">Programming</button>
            <button data-tipo="Database" class="tipo-pill px-2.5 py-1 rounded border hb-border hb-text-muted hover:underline">Database</button>
            <button data-tipo="Hardware & IoT" class="tipo-pill px-2.5 py-1 rounded border hb-border hb-text-muted hover:underline">Hardware &amp; IoT</button>
            <button data-tipo="Networks & Sec" class="tipo-pill px-2.5 py-1 rounded border hb-border hb-text-muted hover:underline">Networks &amp; Sec</button>
        </div>

        <p id="results-status" class="hb-text-muted mb-6 text-sm" data-i18n="results_loading">
            &gt; Cargando proyectos desde PostgreSQL...
        </p>

        <div id="results-container" class="space-y-6"></div>
    </main>

    <footer class="w-full text-center p-6 hb-text-muted text-xs border-t hb-border mt-auto">
        <span>HB Search Engine v3.0 / ImHex@bk.ru</span>
    </footer>

    <script src="app.js"></script>
    <script>
        let filtroTipoActual = 'ALL';
        let listaProyectosActual = [];

        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results-container');
        const resultsStatus = document.getElementById('results-status');
        const currentUser = HBClient.getCurrentUser();

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function cargarProyectos() {
            const t0 = performance.now();
            const query = searchInput.value.trim();
            listaProyectosActual = await HBClient.getProyectos(query, filtroTipoActual, '');
            const elapsed = ((performance.now() - t0) / 1000).toFixed(3);

            const labelFiltro = query || (filtroTipoActual !== 'ALL' ? filtroTipoActual : 'all_projects');
            resultsStatus.innerHTML = `&gt; Encontrados <span class="hb-accent font-bold">${listaProyectosActual.length}</span> proyectos para "<span class="hb-text-main">${escapeHtml(labelFiltro)}</span>" en ${elapsed}s`;

            if (listaProyectosActual.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="border hb-border rounded-md p-8 text-center hb-text-muted">
                        <p class="text-lg hb-accent mb-2">&gt; 0 resultados encontrados</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = listaProyectosActual.map(p => {
                const isOwner = HBClient.esDueno(p, currentUser);
                const isCollab = HBClient.esColaborador(p, currentUser);
                const isSuper = HBClient.esSuperusuario(currentUser);
                const canEdit = isOwner || isCollab || isSuper;
                const canDelete = isOwner || isSuper; // Colaborador NO puede eliminar

                let roleBadge = '';
                if (isOwner) roleBadge = `<span class="text-xs hb-accent font-bold px-2 py-0.5 border hb-border rounded">${HBClient.t('badge_yours')}</span>`;
                else if (isCollab) roleBadge = `<span class="text-xs hb-accent font-bold px-2 py-0.5 border hb-border rounded">${HBClient.t('badge_collab')}</span>`;
                else if (isSuper) roleBadge = `<span class="text-xs hb-accent font-bold px-2 py-0.5 border hb-border rounded">${HBClient.t('badge_superuser')}</span>`;

                const editBtn = canEdit
                    ? `<a href="project-detail.html?id=${p.id}" class="dash-btn px-2.5 py-1 border hb-border rounded hb-text-main">${HBClient.t('btn_edit_project')}</a>`
                    : `<a href="project-detail.html?id=${p.id}" class="dash-btn px-3 py-1 border hb-border rounded hb-text-main">${HBClient.t('btn_view_details')}</a>`;

                const delBtn = canDelete
                    ? `<button onclick="eliminarProyectoListado(${p.id}, '${escapeHtml(p.titulo)}')" class="px-2.5 py-1 border hb-border rounded text-red-400 hover:border-red-500">${HBClient.t('btn_delete_project')}</button>`
                    : '';

                // Cambio 5: En el buscador se muestra la descripción pequeña (descripcionCorta)
                const resumenCorta = p.descripcionCorta || p.descripcion || '';
                const totalEnlaces = Array.isArray(p.enlaces) ? p.enlaces.length : (p.repositorioUrl ? 1 : 0);
                const totalComentarios = Array.isArray(p.comentarios) ? p.comentarios.length : 0;
                const colabs = Array.isArray(p.colaboradoresUsernames) && p.colaboradoresUsernames.length > 0
                    ? `<span>| Colab: <strong class="hb-accent">${escapeHtml(p.colaboradoresUsernames.join(', '))}</strong></span>`
                    : '';

                return `
                    <div class="result-card p-5 rounded-md border hb-border hb-panel">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-1">
                            <a href="project-detail.html?id=${p.id}" class="text-xl font-bold hb-accent cursor-pointer hover:underline">
                                { "${escapeHtml(p.titulo)}" }
                            </a>
                            <div class="flex flex-wrap items-center gap-2 text-xs">
                                <span class="px-2 py-0.5 border hb-border rounded hb-text-muted" title="Marcador de visitas">👁️ ${p.visitas || 0} visitas</span>
                                ${roleBadge}
                                ${editBtn}
                                ${delBtn}
                            </div>
                        </div>

                        <div class="text-xs hb-text-muted mb-3 flex flex-wrap gap-2">
                            <span>Tipo: <strong class="hb-accent">${escapeHtml(p.tipo)}</strong></span>
                            <span>|</span>
                            <span>Dueño: { "${escapeHtml(p.autorUsername || 'anon')}" }</span>
                            ${colabs}
                            ${p.tecnologias ? `<span>| Stack: ${escapeHtml(p.tecnologias)}</span>` : ''}
                            <span>| 🔗 ${totalEnlaces} enlace(s)</span>
                            <span>| 💬 ${totalComentarios} comentario(s)</span>
                        </div>

                        <p class="hb-text-main text-sm leading-relaxed cursor-pointer" onclick="window.location.href='project-detail.html?id=${p.id}'">
                            ${escapeHtml(resumenCorta)}
                        </p>
                    </div>
                `;
            }).join('');
        }

        window.eliminarProyectoListado = async function(id, titulo) {
            if (!confirm(`¿Eliminar el proyecto { "${titulo}" } de la base de datos?`)) return;
            try {
                await HBClient.eliminarProyecto(id);
                await cargarProyectos();
            } catch (err) {
                alert(err.message);
            }
        };

        searchInput.addEventListener('input', () => cargarProyectos());
        document.getElementById('clear-search-btn').addEventListener('click', () => {
            searchInput.value = '';
            cargarProyectos();
        });

        document.querySelectorAll('.tipo-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tipo-pill').forEach(b => {
                    b.className = 'tipo-pill px-2.5 py-1 rounded border hb-border hb-text-muted hover:underline';
                });
                btn.className = 'tipo-pill px-2.5 py-1 rounded border hb-border hb-accent font-bold';
                filtroTipoActual = btn.getAttribute('data-tipo');
                cargarProyectos();
            });
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('q')) searchInput.value = params.get('q');
            if (params.get('tipo')) {
                filtroTipoActual = params.get('tipo');
                document.querySelectorAll('.tipo-pill').forEach(b => {
                    if (b.getAttribute('data-tipo') === filtroTipoActual) {
                        b.className = 'tipo-pill px-2.5 py-1 rounded border hb-border hb-accent font-bold';
                    } else {
                        b.className = 'tipo-pill px-2.5 py-1 rounded border hb-border hb-text-muted hover:underline';
                    }
                });
            }
            await cargarProyectos();
        });
    </script>
</body>
</html>
