# ==========================================================
# HERSON'S BACKPACK v4.0 - CONFIGURACIÓN DE BASE DE DATOS LOCAL
# ==========================================================
spring.application.name=hersons-backpack
server.port=8080

# --- OPCIÓN 1: POSTGRESQL LOCAL (ACTIVA POR DEFECTO) ---
# Asegúrate de tener creada la base de datos 'herson_backpack_db' en pgAdmin 4 o psql
spring.datasource.url=jdbc:postgresql://localhost:5432/herson_backpack_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Ejecución automática de data.sql (copia exacta de database/init_postgres.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

