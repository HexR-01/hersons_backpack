<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herson's Backpack - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .bg-gradient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.3;
            animation: float 20s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .blob-1 {
            width: 50vw;
            height: 50vw;
            top: -20%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 40vw;
            height: 40vw;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5%, 10%) scale(1.1); }
            66% { transform: translate(-5%, -5%) scale(0.9); }
            100% { transform: translate(10%, -10%) scale(1.05); }
        }

        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dash-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            z-index: 1;
        }
        
        .dash-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
            z-index: -1;
        }
        
        .dash-btn:hover::before {
            left: 0;
        }

        .icon-btn {
            transition: color 0.2s, filter 0.2s;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-gradient-blob blob-1"></div>
    <div class="bg-gradient-blob blob-2"></div>
    <canvas id="matrix-canvas"></canvas>

    <div class="content-layer">
        
        <!-- Header / Nav -->
        <header class="flex justify-between items-center p-6 w-full">
            <div class="relative inline-block text-left">
                <a href="index.html" id="back-btn" class="icon-btn hb-text-muted cursor-pointer p-2 rounded-full focus:outline-none inline-block" aria-label="Go Back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </div>
            <div></div>
        </header>

        <!-- Center Content -->
        <main class="flex-grow flex flex-col items-center justify-center w-full px-4 sm:px-0">
            
            <!-- Main Logo Image -->
            <a href="index.html">
                <img src="hb.png" alt="HB Logo" class="h-28 md:h-40 mb-10 object-contain select-none filter drop-shadow-[0_0_8px_rgba(74,222,128,0.4)]">
            </a>

            <form id="login-form" class="w-full max-w-md flex flex-col items-center">
                <!-- Username Input (No prefilled recommendations) -->
                <div class="cmd-input flex items-center border hb-border rounded-md hb-panel-alpha backdrop-blur-sm px-4 py-3 mb-4 w-full transition-all duration-300">
                    <span class="hb-accent mr-3 text-lg font-bold">User:</span>
                    <input 
                        id="login-username"
                        type="text" 
                        placeholder="username" 
                        class="bg-transparent w-full focus:outline-none hb-text-main placeholder-gray-500 font-mono text-lg"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="cmd-input flex items-center border hb-border rounded-md hb-panel-alpha backdrop-blur-sm px-4 py-3 mb-6 w-full transition-all duration-300">
                    <span class="hb-accent mr-3 text-lg font-bold">Pass:</span>
                    <input 
                        id="login-password"
                        type="password" 
                        placeholder="••••••••" 
                        class="bg-transparent w-full focus:outline-none hb-text-main placeholder-gray-500 font-mono text-lg"
                        required
                    >
                </div>

                <p id="login-msg" class="text-xs mb-4 hidden"></p>

                <!-- Login Button -->
                <button type="submit" class="dash-btn w-full border hb-border rounded-md py-3 px-4 text-center hb-text-main font-medium tracking-wider flex items-center justify-center gap-2 group">
                    <span class="hb-text-muted">[&gt;]</span> 
                    <span data-i18n="login_btn">Login</span>
                </button>
                <div class="mt-4 text-xs hb-text-muted">
                    <span data-i18n="login_no_account">¿No tienes cuenta?</span>
                    <a href="signup.html" class="hb-accent hover:underline ml-1" data-i18n="nav_signup">Crear Cuenta Normal</a>
                </div>
            </form>

        </main>

        <!-- Footer -->
        <footer class="w-full text-center p-6 hb-text-muted text-sm">
            <span class="hover:underline cursor-pointer transition-colors duration-300">About / ImHex@bk.ru</span>
        </footer>

    </div>

    <script src="app.js"></script>
    <script>
        // Si ya inició sesión en una cuenta existente, redirige para evitar redundancia de Login
        if (HBClient.getCurrentUser()) {
            window.location.replace('index.html');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;
            const msg = document.getElementById('login-msg');

            try {
                const user = await HBClient.login(u, p);
                msg.textContent = `> Authenticated as { "${user.username}" }. Redirecting...`;
                msg.className = 'text-xs hb-accent mb-4';
                msg.classList.remove('hidden');
                setTimeout(() => { window.location.href = 'index.html'; }, 400);
            } catch (err) {
                msg.textContent = `> Error: ${err.message}`;
                msg.className = 'text-xs text-red-500 mb-4';
                msg.classList.remove('hidden');
            }
        });

        // Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?/\~`ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
        const charArray = chars.split('');
        let fontSize = 16;
        let columns = width / fontSize;
        let drops = [];
        for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = width / fontSize;
            drops = [];
            for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;
        });
        function draw() {
            const colors = HBClient.getMatrixColors();
            ctx.fillStyle = colors.fill;
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = colors.text;
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 40);
    </script>
</body>
</html>
