spring.application.name=hersons-backpack

# 1. PUERTO DINÁMICO (Render inyecta la variable PORT automáticamente; en local usa 8080)
server.port=${PORT:8080}

# 2. CONEXIÓN A NEON POSTGRESQL (Lee variables de entorno en Render, o usa tus datos por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-gentle-block-bekijxgy-pooler.c-9.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=npg_5hpJT6FyjBCe&sslmode=require&channelBinding=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_5hpJT6FyjBCe}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. CONFIGURACIÓN DE POOL HIKARI (Evita que falle la conexión cuando Neon entra en suspensión/auto-suspend)
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# 4. HIBERNATE / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# 5. INICIALIZACIÓN DE DATOS (Si ya subiste las tablas y CSVs en Neon, déjalo en 'never' para acelerar el arranque)
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
